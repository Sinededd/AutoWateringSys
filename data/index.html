<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ESP32-C3 SuperMini Контроль</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            display: flex;
            justify-content: center;
            align-items: start;
            min-height: 100vh;
            margin: 0;
            padding: 10px 0;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            text-align: center;
            max-width: 450px;
            width: 90%;
        }

        h2 {
            font-size: 1.1rem;
            color: #444;
            margin-top: 25px;
            border-bottom: 2px solid #eee;
            padding-bottom: 8px;
            text-align: left;
        }

        .device-list {
            list-style-type: none;
            padding: 0;
            margin: 10px 0 0 0;
            max-height: 250px;
            overflow-y: auto;
        }

        .device-item {
            background: #f8f9fa;
            border: 1px solid #e9ecef;
            padding: 12px;
            margin-bottom: 8px;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.9rem;
            transition: all 0.2s ease;
        }

        #connected-list .device-item {
            cursor: pointer;
        }

        #connected-list .device-item:hover {
            background: #edf2f7;
            border-color: #cbd5e0;
        }

        .device-item.offline {
            opacity: 0.6;
            background: #f1f3f5;
            border-style: dashed;
        }

        .device-item.offline .hum-val {
            color: #6c757d !important;
        }

        .btn-connect {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }

        .btn-connect:hover { background-color: #0056b3; }
        .btn-connect:disabled { background-color: #6c757d; cursor: not-allowed; }

        .sensor-data {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
        }

        .hum-val {
            color: #0056b3;
            font-weight: bold;
            font-size: 1.05rem;
        }

        .info-val {
            font-size: 0.75rem;
            color: #777;
            margin-top: 2px;
        }

        /* СТИЛИ ДЛЯ МОДАЛЬНОГО ОКНА */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.4);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal-content {
            background: white;
            padding: 25px;
            border-radius: 12px;
            width: 85%;
            max-width: 350px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.2);
            text-align: left;
            position: relative;
        }
        .modal-content h3 { margin-top: 0; color: #333; }
        .modal-content label { font-size: 0.85rem; color: #555; display: block; margin-bottom: 5px;}
        .modal-content input {
            width: 100%; padding: 8px; border: 1px solid #ccc; 
            border-radius: 6px; margin-bottom: 20px; box-sizing: border-box;
        }
        .modal-actions { display: flex; justify-content: space-between; }
        .btn-delete {
            background-color: #dc3545; color: white; border: none;
            padding: 8px 14px; border-radius: 6px; cursor: pointer; font-weight: bold;
        }
        .btn-delete:hover { background-color: #bd2130; }
        .btn-close {
            background-color: #6c757d; color: white; border: none;
            padding: 8px 14px; border-radius: 6px; cursor: pointer;
        }
    </style>
</head>

<body>

    <div class="card">
        <h1 style="font-size: 1.6rem; margin-top: 0; color: #222;">ESP32-C3 SuperMini</h1>

        <h2>Запросы на подключение (Новые)</h2>
        <ul id="pairing-list" class="device-list"></ul>

        <h2>Подключенные устройства (Активные)</h2>
        <ul id="connected-list" class="device-list"></ul>
    </div>

    <div id="settings-modal" class="modal-overlay" onclick="closeModal(event)">
        <div class="modal-content" onclick="event.stopPropagation()">
            <h3>Настройки датчика</h3>
            <p id="modal-mac" style="font-family: monospace; font-size:0.85rem; color:#666; margin-bottom:15px;"></p>
            
            <label for="sensor-name">Кастомное имя устройства:</label>
            <input type="text" id="sensor-name" placeholder="Например, Кухня">
            
            <div class="modal-actions">
                <button class="btn-delete" onclick="deleteSensorFromModal()">Удалить</button>
                <div>
                    <button class="btn-close" onclick="closeModal(null)">Отмена</button>
                    <button class="btn-connect" onclick="saveSensorName()">Сохранить</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        let selectedMac = ''; // Храним текущий редактируемый датчик

        function getRSSIColor(rssi) {
            if (rssi >= -67) return '#28a745';
            if (rssi >= -80) return '#ffc107';
            return '#dc3545';
        }

        function createOfflineRow(mac, name) {
            return `
                <div style="font-family: monospace;">
                    <span class="device-display-name" style="font-weight: bold; font-family: Arial, sans-serif;">${name || mac}</span><br>
                    <span style="color: #6c757d; font-size: 0.8rem;">${mac}</span>
                </div>
                <div class="sensor-data">
                    <span class="hum-val">💧 --%</span>
                    <span class="info-val">Оффлайн</span>
                </div>
            `;
        }

        // Загрузка сопряженных устройств
        document.addEventListener('DOMContentLoaded', () => {
            fetch('/devices')
                .then(response => response.json())
                .then(devices => {
                    const connectedList = document.getElementById('connected-list');
                    devices.forEach(dev => {
                        if (!document.getElementById(dev.mac)) {
                            const li = document.createElement('li');
                            li.id = dev.mac;
                            li.className = 'device-item offline';
                            li.setAttribute('data-name', dev.name);
                            li.innerHTML = createOfflineRow(dev.mac, dev.name);
                            // Открытие модалки по клику на датчик
                            li.onclick = () => openModal(dev.mac, dev.name);
                            connectedList.appendChild(li);
                        }
                    });
                })
                .catch(err => console.error("Ошибка загрузки устройств:", err));
        });

        // Открытие и закрытие модального окна
        function openModal(mac, currentName) {
            selectedMac = mac;
            document.getElementById('modal-mac').textContent = `MAC: ${mac}`;
            document.getElementById('sensor-name').value = currentName === mac ? '' : currentName;
            document.getElementById('settings-modal').style.display = 'flex';
        }

        function closeModal(e) {
            if(!e || e.target === document.getElementById('settings-modal') || e === null) {
                document.getElementById('settings-modal').style.display = 'none';
            }
        }

        // Сохранение нового имени
        function saveSensorName() {
            const newName = document.getElementById('sensor-name').value.trim();
            const finalName = newName || selectedMac;

            fetch(`/rename?mac=${selectedMac}&name=${encodeURIComponent(finalName)}`)
                .then(res => {
                    if(res.ok) {
                        const li = document.getElementById(selectedMac);
                        if(li) {
                            li.setAttribute('data-name', finalName);
                            const nameSpan = li.querySelector('.device-display-name');
                            if(nameSpan) nameSpan.textContent = finalName;
                            // На всякий случай обновляем onclick с новым именем
                            li.onclick = () => openModal(selectedMac, finalName);
                        }
                        document.getElementById('settings-modal').style.display = 'none';
                    } else { alert("Ошибка сохранения имени"); }
                });
        }

        // Удаление датчика из модалки
        function deleteSensorFromModal() {
            if(!confirm(`Вы точно хотите удалить датчик ${selectedMac}?`)) return;

            fetch(`/delete?mac=${selectedMac}`)
                .then(res => {
                    if(res.ok) {
                        const li = document.getElementById(selectedMac);
                        if(li) li.remove();
                        document.getElementById('settings-modal').style.display = 'none';
                    } else { alert("Ошибка при удалении"); }
                });
        }

        function connectDevice(mac) {
            const button = document.querySelector(`[data-btn="${mac}"]`);
            if (button) button.disabled = true;

            fetch(`/connect?mac=${mac}`)
                .then(response => {
                    if (response.ok) {
                        const li = document.getElementById(mac);
                        if (li) {
                            li.className = 'device-item offline';
                            li.setAttribute('data-name', mac);
                            li.innerHTML = createOfflineRow(mac, mac);
                            li.onclick = () => openModal(mac, mac);
                            document.getElementById('connected-list').appendChild(li);
                        }
                    } else {
                        if (button) button.disabled = false;
                    }
                });
        }

        if (!!window.EventSource) {
            const source = new EventSource('/events');

            source.addEventListener('pairing_request', function (e) {
                const data = JSON.parse(e.data);
                if (document.getElementById('connected-list').querySelector(`[id="${data.mac}"]`)) return;

                const pairingList = document.getElementById('pairing-list');

                if (!document.getElementById(data.mac)) {
                    const li = document.createElement('li');
                    li.id = data.mac;
                    li.className = 'device-item';

                    let rssiColor = getRSSIColor(data.rssi);
                    li.innerHTML = `
                        <div style="font-family: monospace;">
                            <span>${data.mac}</span><br>
                            <span class="rssi-value" style="color: ${rssiColor}; font-size: 0.8rem; font-weight: bold;">${data.rssi} dBm</span>
                        </div>
                        <button class="btn-connect" data-btn="${data.mac}" onclick="connectDevice('${data.mac}')">Подключить</button>
                    `;
                    pairingList.appendChild(li);
                }
            }, false);

            source.addEventListener('new_readings', function (e) {
                const data = JSON.parse(e.data);
                let li = document.getElementById(data.mac);
                const connectedList = document.getElementById('connected-list');

                let currentName = data.mac;
                if (!li) {
                    li = document.createElement('li');
                    li.id = data.mac;
                    li.setAttribute('data-name', currentName);
                    li.onclick = () => openModal(data.mac, currentName);
                    connectedList.appendChild(li);
                } else {
                    currentName = li.getAttribute('data-name') || data.mac;
                }

                li.className = 'device-item'; 
                let rssiColor = getRSSIColor(data.rssi);
                
                li.innerHTML = `
                    <div style="font-family: monospace;">
                        <span class="device-display-name" style="font-weight: bold; font-family: Arial, sans-serif;">${currentName}</span><br>
                        <span style="color: ${rssiColor}; font-size: 0.8rem; font-weight: bold;">${data.rssi} dBm</span>
                    </div>
                    <div class="sensor-data">
                        <span class="hum-val">💧 ${data.humidity}%</span>
                        <span class="info-val">Пакет №${data.readingId}</span>
                    </div>
                `;
            }, false);
        }
    </script>
</body>
</html>
