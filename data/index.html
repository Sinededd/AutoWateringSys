<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ESP32-C3 SuperMini Контроль</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            display: flex;
            justify-content: center;
            align-items: start;
            min-height: 100vh;
            margin: 0;
            padding: 10px 0;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            text-align: center;
            max-width: 450px;
            width: 90%;
        }

        h2 {
            font-size: 1.1rem;
            color: #444;
            margin-top: 25px;
            border-bottom: 2px solid #eee;
            padding-bottom: 8px;
            text-align: left;
        }

        .device-list {
            list-style-type: none;
            padding: 0;
            margin: 10px 0 0 0;
            max-height: 200px;
            overflow-y: auto;
        }

        .device-item {
            background: #f8f9fa;
            border: 1px solid #e9ecef;
            padding: 12px;
            margin-bottom: 8px;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.9rem;
            font-family: monospace;
            transition: opacity 0.3s ease;
        }

        /* Стили для устройств без актуальных данных (Оффлайн) */
        .device-item.offline {
            opacity: 0.6;
            background: #f1f3f5;
            border-style: dashed;
        }

        .device-item.offline .hum-val {
            color: #6c757d !important;
        }

        .btn-connect {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-family: Arial, sans-serif;
            font-weight: bold;
            transition: background 0.2s;
        }

        .btn-connect:hover {
            background-color: #0056b3;
        }

        .btn-connect:disabled {
            background-color: #6c757d;
            cursor: not-allowed;
        }

        .sensor-data {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            font-family: Arial, sans-serif;
        }

        .hum-val {
            color: #0056b3;
            font-weight: bold;
            font-size: 1.05rem;
        }

        .info-val {
            font-size: 0.75rem;
            color: #777;
            margin-top: 2px;
        }
    </style>
</head>

<body>

    <div class="card">
        <h1 style="font-size: 1.6rem; margin-top: 0; color: #222;">ESP32-C3 SuperMini</h1>

        <h2>Запросы на подключение (Новые)</h2>
        <ul id="pairing-list" class="device-list"></ul>

        <h2>Подключенные устройства (Активные)</h2>
        <ul id="connected-list" class="device-list"></ul>
    </div>

    <script>
        function getRSSIColor(rssi) {
            if (rssi >= -67) return '#28a745';
            if (rssi >= -80) return '#ffc107';
            return '#dc3545';
        }

        // Шаблон для отрисовки оффлайн-устройства
        function createOfflineRow(mac) {
            return `
                <div>
                    <span style="font-weight: bold;">${mac}</span><br>
                    <span style="color: #6c757d; font-size: 0.8rem;">Нет данных</span>
                </div>
                <div class="sensor-data">
                    <span class="hum-val">💧 --%</span>
                    <span class="info-val">Оффлайн</span>
                </div>
            `;
        }

        // Запрос списка уже сопряженных устройств при загрузке страницы
        document.addEventListener('DOMContentLoaded', () => {
            fetch('/devices')
                .then(response => response.json())
                .then(devices => {
                    const connectedList = document.getElementById('connected-list');
                    devices.forEach(mac => {
                        if (!document.getElementById(mac)) {
                            const li = document.createElement('li');
                            li.id = mac;
                            li.className = 'device-item offline'; // делаем серым
                            li.innerHTML = createOfflineRow(mac);
                            connectedList.appendChild(li);
                        }
                    });
                })
                .catch(err => console.error("Ошибка загрузки списка устройств:", err));
        });

        // Функция отправки команды на Хост для одобрения сопряжения
        function connectDevice(mac) {
            const button = document.querySelector(`[data-btn="${mac}"]`);
            if (button) button.disabled = true;

            fetch(`/connect?mac=${mac}`)
                .then(response => {
                    if (response.ok) {
                        console.log(`Запрос на подключение ${mac} отправлен успешно`);
                        const li = document.getElementById(mac);
                        if (li) {
                            // Переносим в список подключенных и временно делаем серым до первых данных
                            li.className = 'device-item offline';
                            li.innerHTML = createOfflineRow(mac);
                            document.getElementById('connected-list').appendChild(li);
                        }
                    } else {
                        if (button) button.disabled = false;
                        alert("Ошибка сервера при попытке подключения");
                    }
                })
                .catch(err => {
                    if (button) button.disabled = false;
                    console.error("Ошибка сети:", err);
                });
        }

        if (!!window.EventSource) {
            const source = new EventSource('/events');

            source.addEventListener('pairing_request', function (e) {
                console.log("Новый запрос на сопряжение:", e.data);
                const data = JSON.parse(e.data);
                
                // Если устройство уже есть в списке активных/подключенных, игнорируем запрос на сопряжение
                if (document.getElementById('connected-list').querySelector(`[id="${data.mac}"]`)) {
                    return;
                }

                const pairingList = document.getElementById('pairing-list');

                if (!document.getElementById(data.mac)) {
                    const li = document.createElement('li');
                    li.id = data.mac;
                    li.className = 'device-item';

                    let rssiColor = getRSSIColor(data.rssi);
                    li.innerHTML = `
                        <div>
                            <span>${data.mac}</span><br>
                            <span class="rssi-value" style="color: ${rssiColor}; font-size: 0.8rem; font-weight: bold;">
                                ${data.rssi} dBm
                            </span>
                        </div>
                        <button class="btn-connect" data-btn="${data.mac}" onclick="connectDevice('${data.mac}')">Подключить</button>
                    `;
                    pairingList.appendChild(li);
                } else {
                    const existingItem = document.getElementById(data.mac);
                    const rssiSpan = existingItem.querySelector('.rssi-value');
                    if (rssiSpan) {
                        let rssiColor = getRSSIColor(data.rssi);
                        rssiSpan.textContent = `${data.rssi} dBm`;
                        rssiSpan.style.color = rssiColor;
                    }
                }
            }, false);

            source.addEventListener('new_readings', function (e) {
                console.log("Получены данные датчика:", e.data);
                const data = JSON.parse(e.data);
                
                let li = document.getElementById(data.mac);
                const connectedList = document.getElementById('connected-list');
                const pairingList = document.getElementById('pairing-list');

                if (!li) {
                    li = document.createElement('li');
                    li.id = data.mac;
                    li.className = 'device-item';
                    connectedList.appendChild(li);
                } else {
                    // Обязательно убираем класс 'offline', возвращая нормальный цвет
                    li.className = 'device-item'; 
                    if (li.parentNode === pairingList) {
                        connectedList.appendChild(li);
                    }
                }

                let rssiColor = getRSSIColor(data.rssi);
                
                // Заполняем актуальной телеметрией
                li.innerHTML = `
                    <div>
                        <span style="font-weight: bold;">${data.mac}</span><br>
                        <span style="color: ${rssiColor}; font-size: 0.8rem; font-weight: bold;">${data.rssi} dBm</span>
                    </div>
                    <div class="sensor-data">
                        <span class="hum-val">💧 ${data.humidity}%</span>
                        <span class="info-val">Пакет №${data.readingId}</span>
                    </div>
                `;
            }, false);
        } else {
            console.log("Браузер не поддерживает EventSource.");
        }
    </script>
</body>

</html>
