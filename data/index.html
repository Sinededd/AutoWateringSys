<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ESP32-C3 SuperMini Контроль</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            display: flex;
            justify-content: center;
            align-items: start;
            min-height: 100vh;
            margin: 0;
            padding: 10px 0;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            text-align: center;
            max-width: 450px;
            width: 90%;
        }

        h2 {
            font-size: 1.1rem;
            color: #444;
            margin-top: 25px;
            border-bottom: 2px solid #eee;
            padding-bottom: 8px;
            text-align: left;
        }

        .device-list {
            list-style-type: none;
            padding: 0;
            margin: 10px 0 0 0;
            max-height: 250px;
            overflow-y: auto;
        }

        .device-item {
            background: #f8f9fa;
            border: 1px solid #e9ecef;
            padding: 12px;
            margin-bottom: 8px;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.9rem;
            transition: all 0.2s ease;
        }

        #connected-list .device-item {
            cursor: pointer;
        }

        #connected-list .device-item:hover {
            background: #edf2f7;
            border-color: #cbd5e0;
        }

        .device-item.offline {
            opacity: 0.6;
            background: #f1f3f5;
            border-style: dashed;
        }

        .device-item.offline .hum-val {
            color: #6c757d !important;
        }

        .btn-connect {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 8px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }

        .btn-connect:hover { background-color: #0056b3; }
        .btn-connect:disabled { background-color: #6c757d; cursor: not-allowed; }

        .sensor-data {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
        }

        .hum-val {
            color: #0056b3;
            font-weight: bold;
            font-size: 1.05rem;
        }

        .info-val {
            font-size: 0.75rem;
            color: #777;
            margin-top: 2px;
        }

        /* СТИЛИ ДЛЯ МОДАЛЬНОГО ОКНА */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.4);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal-content {
            background: white;
            padding: 25px;
            border-radius: 12px;
            width: 85%;
            max-width: 400px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.2);
            text-align: left;
            position: relative;
        }
        .modal-content h3 { margin-top: 0; color: #333; margin-bottom: 5px; }
        .modal-content label { font-size: 0.8rem; color: #555; display: block; margin-bottom: 4px; font-weight: bold;}
        .modal-content input {
            width: 100%; padding: 8px; border: 1px solid #ccc; 
            border-radius: 6px; margin-bottom: 12px; box-sizing: border-box;
            font-size: 0.9rem;
        }
        
        /* Двухколоночный вывод настроек в модалке */
        .form-row {
            display: flex;
            gap: 12px;
        }
        .form-row > div {
            flex: 1;
        }

        /* Статусный алерт внутри модалки */
        .status-alert {
            display: none;
            padding: 10px;
            margin-bottom: 15px;
            border-radius: 6px;
            font-size: 0.85rem;
            font-weight: bold;
            line-height: 1.3;
        }

        .modal-actions { display: flex; justify-content: space-between; margin-top: 10px; }
        .btn-delete {
            background-color: #dc3545; color: white; border: none;
            padding: 8px 14px; border-radius: 6px; cursor: pointer; font-weight: bold;
        }
        .btn-delete:hover { background-color: #bd2130; }
        .btn-close {
            background-color: #6c757d; color: white; border: none;
            padding: 8px 14px; border-radius: 6px; cursor: pointer;
        }
        .btn-close:hover { background-color: #5a6268; }
    </style>
</head>

<body>

    <div class="card">
        <h1 style="font-size: 1.6rem; margin-top: 0; color: #222;">ESP32-C3 SuperMini</h1>

        <h2>Запросы на подключение (Новые)</h2>
        <ul id="pairing-list" class="device-list"></ul>

        <h2>Подключенные устройства (Активные)</h2>
        <ul id="connected-list" class="device-list"></ul>
    </div>

    <div id="settings-modal" class="modal-overlay" onclick="closeModal(event)">
        <div class="modal-content" onclick="event.stopPropagation()">
            <h3>Настройки датчика</h3>
            <p id="modal-mac" style="font-family: monospace; font-size:0.85rem; color:#666; margin-bottom:15px; margin-top: 0;"></p>
            
            <div id="settings-status-alert" class="status-alert"></div>

            <label for="sensor-name">Кастомное имя устройства:</label>
            <input type="text" id="sensor-name" placeholder="Например, Кухня">
            
            <div class="form-row">
                <div>
                    <label for="sensor-sleep">Период сна (сек):</label>
                    <input type="number" id="sensor-sleep" min="5" max="86400">
                </div>
                <div>
                    <label for="sensor-threshold">Порог отправки (Δ%):</label>
                    <input type="number" id="sensor-threshold" min="0" max="100">
                </div>
            </div>

            <div class="form-row">
                <div>
                    <label for="sensor-air">Калибровка: Сухой (мВ):</label>
                    <input type="number" id="sensor-air" min="0" max="4095">
                </div>
                <div>
                    <label for="sensor-water">Калибровка: Вода (мВ):</label>
                    <input type="number" id="sensor-water" min="0" max="4095">
                </div>
            </div>

            <div class="form-row">
                <div>
                    <label for="sensor-wifi">Мощность WiFi (TX):</label>
                    <input type="number" id="sensor-wifi" min="8" max="84">
                </div>
                <div>
                    <label for="sensor-max-skip">Пульс (макс пропусков):</label>
                    <input type="number" id="sensor-max-skip" min="1" max="50">
                </div>
            </div>
            
            <div class="modal-actions">
                <button class="btn-delete" onclick="deleteSensorFromModal()">Удалить</button>
                <div>
                    <button class="btn-close" onclick="closeModal(null)">Отмена</button>
                    <button class="btn-connect" onclick="saveSensorSettings()">Применить</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        let selectedMac = ''; 
        // Глобальный кэш для хранения настроек всех датчиков
        let deviceCache = {}; 

        function getRSSIColor(rssi) {
            if (rssi >= -67) return '#28a745';
            if (rssi >= -80) return '#ffc107';
            return '#dc3545';
        }

        function createOfflineRow(mac, name) {
            return `
                <div style="font-family: monospace;">
                    <span class="device-display-name" style="font-weight: bold; font-family: Arial, sans-serif;">${name || mac}</span><br>
                    <span style="color: #6c757d; font-size: 0.8rem;">${mac}</span>
                </div>
                <div class="sensor-data">
                    <span class="hum-val">💧 --%</span>
                    <span class="info-val">Оффлайн</span>
                </div>
            `;
        }

        // Загрузка сопряженных устройств и их конфигураций из NVS памяти хоста
        document.addEventListener('DOMContentLoaded', () => {
            fetch('/devices')
                .then(response => response.json())
                .then(devices => {
                    const connectedList = document.getElementById('connected-list');
                    devices.forEach(dev => {
                        // Сохраняем в кэш все пришедшие настройки датчика
                        deviceCache[dev.mac] = {
                            name: dev.name,
                            air: dev.air || 2300,
                            water: dev.water || 1200,
                            sleep: dev.sleep || 600,
                            wifi: dev.wifi || 40,
                            threshold: dev.threshold || 2,
                            max_skip: dev.max_skip || 3
                        };

                        if (!document.getElementById(dev.mac)) {
                            const li = document.createElement('li');
                            li.id = dev.mac;
                            li.className = 'device-item offline';
                            li.innerHTML = createOfflineRow(dev.mac, dev.name);
                            li.onclick = () => openModal(dev.mac);
                            connectedList.appendChild(li);
                        }
                    });
                })
                .catch(err => console.error("Ошибка загрузки устройств:", err));
        });

        // Открытие модального окна и заполнение полей данными из кэша
        function openModal(mac) {
            selectedMac = mac;
            const dev = deviceCache[mac] || {};

            document.getElementById('modal-mac').textContent = `MAC: ${mac}`;
            document.getElementById('sensor-name').value = dev.name === mac ? '' : (dev.name || '');
            
            // Наполнение полей ввода конфигурации
            document.getElementById('sensor-sleep').value = dev.sleep || 600;
            document.getElementById('sensor-threshold').value = dev.threshold || 2;
            document.getElementById('sensor-air').value = dev.air || 2300;
            document.getElementById('sensor-water').value = dev.water || 1200;
            document.getElementById('sensor-wifi').value = dev.wifi || 40;
            document.getElementById('sensor-max-skip').value = dev.max_skip || 3;

            // Сбрасываем статус-алерт при каждом новом открытии
            const statusAlert = document.getElementById('settings-status-alert');
            statusAlert.style.display = 'none';
            statusAlert.textContent = '';

            document.getElementById('settings-modal').style.display = 'flex';
        }

        function closeModal(e) {
            if(!e || e.target === document.getElementById('settings-modal') || e === null) {
                document.getElementById('settings-modal').style.display = 'none';
            }
        }

        // Сохранение имени И отправка обновленных радио-настроек на датчик
        function saveSensorSettings() {
            const newName = document.getElementById('sensor-name').value.trim() || selectedMac;
            
            const air = document.getElementById('sensor-air').value;
            const water = document.getElementById('sensor-water').value;
            const sleep = document.getElementById('sensor-sleep').value;
            const wifi = document.getElementById('sensor-wifi').value;
            const threshold = document.getElementById('sensor-threshold').value;
            const max_skip = document.getElementById('sensor-max-skip').value;

            const statusAlert = document.getElementById('settings-status-alert');
            statusAlert.style.display = 'block';
            statusAlert.style.backgroundColor = '#e2e8f0';
            statusAlert.style.color = '#4a5568';
            statusAlert.textContent = 'Сохранение данных на Хосте...';

            // Шаг 1: Переименовываем устройство в базе хоста
            fetch(`/rename?mac=${selectedMac}&name=${encodeURIComponent(newName)}`)
                .then(res => {
                    if(res.ok) {
                        if (!deviceCache[selectedMac]) deviceCache[selectedMac] = {};
                        deviceCache[selectedMac].name = newName;

                        const li = document.getElementById(selectedMac);
                        if(li) {
                            const nameSpan = li.querySelector('.device-display-name');
                            if(nameSpan) nameSpan.textContent = newName;
                        }
                        
                        // Шаг 2: Отправляем новые настройки в эфир через ESP-NOW
                        statusAlert.style.backgroundColor = '#feebc8';
                        statusAlert.style.color = '#c05621';
                        statusAlert.textContent = 'Пакет отправлен в эфир. Ожидание подтверждения от датчика...';

                        return fetch(`/update_settings?mac=${selectedMac}&air=${air}&water=${water}&sleep=${sleep}&wifi=${wifi}&threshold=${threshold}&max_skip=${max_skip}`);
                    } else { 
                        throw new Error("Ошибка сохранения имени устройства."); 
                    }
                })
                .then(res => {
                    if(!res.ok) throw new Error("Ошибка отправки ESP-NOW пакета сервером.");
                })
                .catch(err => {
                    statusAlert.style.backgroundColor = '#fed7d7';
                    statusAlert.style.color = '#9b2c2c';
                    statusAlert.textContent = err.message;
                });
        }

        // Удаление датчика
        function deleteSensorFromModal() {
            if(!confirm(`Вы точно хотите удалить датчик ${selectedMac}?`)) return;

            fetch(`/delete?mac=${selectedMac}`)
                .then(res => {
                    if(res.ok) {
                        const li = document.getElementById(selectedMac);
                        if(li) li.remove();
                        delete deviceCache[selectedMac]; // Вычищаем из кэша
                        document.getElementById('settings-modal').style.display = 'none';
                    } else { alert("Ошибка при удалении"); }
                });
        }

        function connectDevice(mac) {
            const button = document.querySelector(`[data-btn="${mac}"]`);
            if (button) button.disabled = true;

            fetch(`/connect?mac=${mac}`)
                .then(response => {
                    if (response.ok) {
                        const li = document.getElementById(mac);
                        if (li) {
                            li.className = 'device-item offline';
                            li.innerHTML = createOfflineRow(mac, mac);
                            li.onclick = () => openModal(mac);
                            document.getElementById('connected-list').appendChild(li);
                        }
                    } else {
                        if (button) button.disabled = false;
                    }
                });
        }

        if (!!window.EventSource) {
            const source = new EventSource('/events');

            source.addEventListener('pairing_request', function (e) {
                const data = JSON.parse(e.data);
                if (document.getElementById('connected-list').querySelector(`[id="${data.mac}"]`)) return;

                const pairingList = document.getElementById('pairing-list');

                if (!document.getElementById(data.mac)) {
                    const li = document.createElement('li');
                    li.id = data.mac;
                    li.className = 'device-item';

                    let rssiColor = getRSSIColor(data.rssi);
                    li.innerHTML = `
                        <div style="font-family: monospace;">
                            <span>${data.mac}</span><br>
                            <span class="rssi-value" style="color: ${rssiColor}; font-size: 0.8rem; font-weight: bold;">${data.rssi} dBm</span>
                        </div>
                        <button class="btn-connect" data-btn="${data.mac}" onclick="connectDevice('${data.mac}')">Подключить</button>
                    `;
                    pairingList.appendChild(li);
                }
            }, false);

            source.addEventListener('new_readings', function (e) {
                const data = JSON.parse(e.data);
                let li = document.getElementById(data.mac);
                const connectedList = document.getElementById('connected-list');

                // Подтягиваем имя из нашего глобального кэша, если его нет — выводим MAC
                let currentName = (deviceCache[data.mac] && deviceCache[data.mac].name) ? deviceCache[data.mac].name : data.mac;
                
                if (!deviceCache[data.mac]) {
                    deviceCache[data.mac] = { name: currentName };
                }

                if (!li) {
                    li = document.createElement('li');
                    li.id = data.mac;
                    li.onclick = () => openModal(data.mac);
                    connectedList.appendChild(li);
                }

                li.className = 'device-item'; 
                let rssiColor = getRSSIColor(data.rssi);
                
                li.innerHTML = `
                    <div style="font-family: monospace;">
                        <span class="device-display-name" style="font-weight: bold; font-family: Arial, sans-serif;">${currentName}</span><br>
                        <span style="color: ${rssiColor}; font-size: 0.8rem; font-weight: bold;">${data.rssi} dBm</span>
                    </div>
                    <div class="sensor-data">
                        <span class="hum-val">💧 ${data.humidity}%</span>
                        <span class="info-val">Пакет №${data.readingId}</span>
                    </div>
                `;
            }, false);

            // НОВОЕ СОБЫТИЕ: Датчик прислал отчет о своих внутренних настройках
            source.addEventListener('settings_report', function (e) {
                const data = JSON.parse(e.data); // mac, air, water, sleep, wifi, threshold, max_skip
                
                if (!deviceCache[data.mac]) deviceCache[data.mac] = {};
                // Обновляем параметры в локальной памяти (кэше)
                Object.assign(deviceCache[data.mac], data);

                // Если модалка этого датчика открыта прямо сейчас — обновляем значения в полях «на лету»
                if (selectedMac === data.mac && document.getElementById('settings-modal').style.display === 'flex') {
                    document.getElementById('sensor-sleep').value = data.sleep;
                    document.getElementById('sensor-threshold').value = data.threshold;
                    document.getElementById('sensor-air').value = data.air;
                    document.getElementById('sensor-water').value = data.water;
                    document.getElementById('sensor-wifi').value = data.wifi;
                    document.getElementById('sensor-max-skip').value = data.max_skip;
                    
                    const statusAlert = document.getElementById('settings-status-alert');
                    statusAlert.style.display = 'block';
                    statusAlert.style.backgroundColor = '#c6f6d5';
                    statusAlert.style.color = '#22543d';
                    statusAlert.textContent = 'Синхронизировано: получены актуальные настройки из памяти датчика.';
                }
            }, false);

            // НОВОЕ СОБЫТИЕ: Датчик прислал статус выполнения (успех или код ошибки)
            source.addEventListener('settings_status', function (e) {
                const data = JSON.parse(e.data); // mac, success, errorCode
                
                if (selectedMac === data.mac && document.getElementById('settings-modal').style.display === 'flex') {
                    const statusAlert = document.getElementById('settings-status-alert');
                    statusAlert.style.display = 'block';
                    
                    if (data.success === 1) {
                        statusAlert.style.backgroundColor = '#c6f6d5';
                        statusAlert.style.color = '#22543d';
                        statusAlert.textContent = 'Настройки успешно приняты и применены датчиком! ✅';
                        
                        // Так как датчик подтвердил запись, сохраняем эти значения в локальный кэш страницы
                        deviceCache[data.mac].air = parseInt(document.getElementById('sensor-air').value);
                        deviceCache[data.mac].water = parseInt(document.getElementById('sensor-water').value);
                        deviceCache[data.mac].sleep = parseInt(document.getElementById('sensor-sleep').value);
                        deviceCache[data.mac].wifi = parseInt(document.getElementById('sensor-wifi').value);
                        deviceCache[data.mac].threshold = parseInt(document.getElementById('sensor-threshold').value);
                        deviceCache[data.mac].max_skip = parseInt(document.getElementById('sensor-max-skip').value);
                    } else {
                        statusAlert.style.backgroundColor = '#fed7d7';
                        statusAlert.style.color = '#9b2c2c';
                        const errorMessages = [
                            "Неизвестная ошибка", 
                            "Датчик отклонил калибровку (Air/Water)", 
                            "Недопустимый период сна", 
                            "Недопустимая мощность передатчика WiFi", 
                            "Недопустимый порог влажности", 
                            "Недопустимое число пропусков (пульс)"
                        ];
                        statusAlert.textContent = `❌ Датчик отклонил изменения! ${errorMessages[data.errorCode] || ''}`;
                    }
                }
            }, false);
        }
    </script>
</body>
</html>
