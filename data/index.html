<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ESP32-C3 SuperMini Контроль</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            text-align: center;
            max-width: 400px;
            width: 90%;
        }

        h2 {
            font-size: 1.2rem;
            color: #333;
            margin-top: 20px;
            border-bottom: 2px solid #eee;
            padding-bottom: 8px;
        }

        .device-list {
            list-style-type: none;
            padding: 0;
            margin: 15px 0 0 0;
            max-height: 200px;
            overflow-y: auto;
        }

        .device-item {
            background: #f8f9fa;
            border: 1px solid #e9ecef;
            padding: 10px;
            margin-bottom: 8px;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.9rem;
            font-family: monospace;
        }
    </style>
</head>

<body>

    <div class="card">
        <h1>ESP32-C3 SuperMini</h1>

        <h2>Запросы на подключение (ESP-NOW)</h2>
        <ul id="device-list" class="device-list">
        </ul>
    </div>

    <script>
        // Функция для определения цвета уровня сигнала (RSSI)
        function getRSSIColor(rssi) {
            if (rssi >= -67) return '#28a745'; // Отличный сигнал (Зеленый)
            if (rssi >= -80) return '#ffc107'; // Средний сигнал (Желтый)
            return '#dc3545';                  // Плохой сигнал (Красный)
        }

        if (!!window.EventSource) {
            const source = new EventSource('/events');

            source.addEventListener('open', function (e) {
                console.log("SSE соединение установлено");
            }, false);

            source.addEventListener('error', function (e) {
                if (e.target.readyState == EventSource.CLOSED) {
                    console.log("SSE соединение закрыто");
                }
            }, false);

            source.addEventListener('pairing_request', function (e) {
                console.log("Новый запрос на сопряжение:", e.data);
                const data = JSON.parse(e.data);
                const list = document.getElementById('device-list');

                if (!document.getElementById(data.mac)) {
                    const li = document.createElement('li');
                    li.id = data.mac;
                    li.className = 'device-item';

                    let rssiColor = getRSSIColor(data.rssi);
                    li.innerHTML = `
                        <span>${data.mac}</span>
                        <span class="rssi-value" style="color: ${rssiColor}; font-weight: bold;">
                            (${data.rssi} dBm)
                        </span>
                    `;
                    list.appendChild(li);
                } else {
                    const existingItem = document.getElementById(data.mac);
                    const rssiSpan = existingItem.querySelector('.rssi-value');
                    if (rssiSpan) {
                        let rssiColor = getRSSIColor(data.rssi);
                        rssiSpan.textContent = `(${data.rssi} dBm)`;
                        rssiSpan.style.color = rssiColor;
                    }
                }
            }, false);
        } else {
            console.log("Ваш браузер не поддерживает EventSource.");
        }
    </script>
</body>

</html>
